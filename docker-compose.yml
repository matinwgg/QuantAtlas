x-backend-env: &backend-env
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}
  DJANGO_DEBUG: "false"
  DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
  # Local compose serves HTTP on :8080. Terminate TLS at the edge in production
  # and set this to "true".
  DJANGO_SECURE_SSL_REDIRECT: "false"
  DJANGO_TRUST_PROXY: "true"
  CORS_ALLOWED_ORIGINS: http://localhost:8080
  CSRF_TRUSTED_ORIGINS: http://localhost:8080
  TRAINING_API_KEYS: ${TRAINING_API_KEYS:-}
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  DB_NAME: /data/quantatlas.sqlite3
  ALPHAVANTAGE_API_KEY: ${ALPHAVANTAGE_API_KEY:-}

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/backend.Dockerfile
    image: quantatlas-backend:local
    restart: unless-stopped
    environment: *backend-env
    volumes:
      - backend-data:/data
    depends_on:
      redis:
        condition: service_healthy

  worker:
    image: quantatlas-backend:local
    restart: unless-stopped
    command: ["celery", "--workdir", "backend", "-A", "core", "worker", "--loglevel=info"]
    environment: *backend-env
    volumes:
      - backend-data:/data
    depends_on:
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: infrastructure/docker/frontend.Dockerfile
      args:
        # Empty means same-origin requests through nginx.
        NEXT_PUBLIC_API_URL: ""
    image: quantatlas-frontend:local
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend

volumes:
  backend-data:
