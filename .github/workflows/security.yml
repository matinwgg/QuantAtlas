name: Security

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  python-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt bandit pip-audit

      - name: Django deploy checks
        env:
          DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-000000
          DJANGO_ALLOWED_HOSTS: localhost,testserver
          DJANGO_SECURE_SSL_REDIRECT: "true"
        run: python manage.py check --deploy

      - name: Bandit
        run: bandit -r . -x data -ll

      - name: Python dependency audit
        working-directory: .
        run: pip-audit -r requirements.txt --no-deps

  frontend-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/quant-atlas-webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/quant-atlas-webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
