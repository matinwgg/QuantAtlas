name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-with-more-than-fifty-characters-000000
      DJANGO_ALLOWED_HOSTS: localhost,testserver
      DJANGO_SECURE_SSL_REDIRECT: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Service tests
        run: pytest

      - name: Django checks
        working-directory: backend
        run: python manage.py check

      - name: Django API tests
        working-directory: backend
        run: python manage.py test backtesting

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/quant-atlas-webapp
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/quant-atlas-webapp/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: npm run build
